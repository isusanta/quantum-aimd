[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-aimd"
version = "0.1.0"
description = "Quantum-centric ab initio molecular dynamics with sample-based quantum diagonalization"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Susanta Das", email = "dass11@ccf.org" },
]
keywords = ["quantum", "qiskit", "molecular-dynamics", "sqd", "quantum-chemistry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 3 - Alpha",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

# LOWER BOUNDS, not a pinned or validated environment.
#
# Anchored on the stack the science actually runs on, recorded in
# docs/environment-evidence.md (qiskit 2.0.0, qiskit-addon-sqd 0.9.0,
# ffsim 0.0.49, pyscf 2.8.0, numpy 2.2.4, scipy 1.15.2). Floors are set at the
# transitive minima of those versions rather than lower, because no lower
# combination has ever been exercised and declaring one would claim untested
# compatibility. CI proves only what CI runs.
#
# jax and rustworkx were promoted to direct dependencies on 2026-09-21, when the
# modules that import them landed: quantum_aimd.sqd.solver imports jax for the
# gradient machinery, and quantum_aimd.circuits.layout imports rustworkx for the
# heavy-hex coupling graph. Both had arrived transitively before that, which is
# exactly the situation a direct import should not rely on.
#
# ray stays optional, under the hpc extra: quantum_aimd.sqd.driver parallelizes
# the batches with it when present and runs them in sequence when not.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13.1",
    "pyscf>=2.7",
    "qiskit>=1.2",
    "qiskit-ibm-runtime>=0.37",
    "qiskit-addon-sqd>=0.9.0",
    "ffsim>=0.0.49",
    "jax>=0.4.35",
    "rustworkx>=0.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hpc = ["ray>=2.42"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[project.scripts]
quantum-aimd = "quantum_aimd.cli:main"

[project.urls]
# Decided 2026-09-21: the repository lives under the personal account, private
# first and public once the workflow is migrated. These URLs are therefore
# already final and the manuscript cites them. If the project is ever moved to
# an organisation, update these three and CITATION.cff:repository-code in the
# same commit as the move: i-qmapper still points at its pre-transfer owner
# because that step was missed there.
Homepage = "https://github.com/isusanta/quantum-aimd"
Issues = "https://github.com/isusanta/quantum-aimd/issues"
Changelog = "https://github.com/isusanta/quantum-aimd/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# The formatter is excluded from the two modules moved verbatim, for the same
# reason the linter is relaxed there: reformatting would rewrite every line of a
# solver and a layout search, and the value of keeping them diffable against the
# code that produced the published results outweighs uniform style.
exclude = [
    "src/quantum_aimd/circuits/layout.py",
    "src/quantum_aimd/sqd/solver.py",
]

[tool.ruff.lint.per-file-ignores]
# These two modules were moved from the original pipeline with their logic
# untouched, so that the code which produced the published results stays
# diffable against its source. Their style is the original's: unused imports and
# locals left from interactive development, legacy typing, a bare except. Lint is
# therefore relaxed here rather than the code reshaped, because a silent change
# to a solver or a layout search is a far worse outcome than an unused import.
# Cleaning them up is tracked in CHANGELOG.md as a separate, reviewable change.
"src/quantum_aimd/circuits/layout.py" = [
    "E722",    # bare except, in the original
    "F401",    # imports the original left behind
    "F404",    # late __future__ import
    "F841",    # locals the original assigns but does not use
    "I001",    # import block not sorted
    "RUF059",  # unused unpacked variable
    "UP031",   # printf-style formatting
    "UP035",   # deprecated typing import
    "UP037",   # quoted annotation
]
"src/quantum_aimd/sqd/solver.py" = [
    "BLE001",
    "E722",
    "F401",
    "F404",
    "F841",
    "I001",
    "RUF059",
    "UP031",
    "UP035",
    "UP037",
]

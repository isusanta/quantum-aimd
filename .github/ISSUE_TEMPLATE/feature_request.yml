name: Feature request
description: Suggest an improvement or a new capability
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The package is pre-release and the API is not stable, so proposals that
        change an interface are welcome rather than unwelcome. Say which part of
        the pipeline the change would touch.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: The situation you are in now, and why the current behaviour does not serve it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - QUICK / AMBER interface
        - active space and Hamiltonian
        - LUCJ circuit or qubit layout
        - runtime, sessions and sampling
        - S-CORE loop, solver, gradients
        - configuration and CLI
        - documentation
        - tests and CI
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
